---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-api
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  selector:
    matchLabels:
      app: store-api
  template:
    metadata:
      labels:
        app: store-api
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - image: 897783914221.dkr.ecr.us-east-1.amazonaws.com/store-api:1.0
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        envFrom:
        - configMapRef:
            name: store-api-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: store-db-credentials
              key: password
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: "/ready"
            port: 8000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: "/health"
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: "/health"
            port: 8000
          failureThreshold: 30
          periodSeconds: 5
        name: store-api
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      serviceAccountName: store-api
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: store-api
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: store-api
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-front
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  selector:
    matchLabels:
      app: store-front
  template:
    metadata:
      labels:
        app: store-front
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 101
        runAsGroup: 101
      containers:
      - image: 897783914221.dkr.ecr.us-east-1.amazonaws.com/store-front:1.1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: tmp
          mountPath: "/tmp"
        readinessProbe:
          httpGet:
            path: "/healthz"
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: "/healthz"
            port: 8080
          initialDelaySeconds: 10
        name: store-front
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: store-front
              topologyKey: kubernetes.io/hostname
  replicas: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-worker
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  selector:
    matchLabels:
      app: store-worker
  template:
    metadata:
      labels:
        app: store-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - image: 897783914221.dkr.ecr.us-east-1.amazonaws.com/store-worker:1.0
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        envFrom:
        - configMapRef:
            name: store-api-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: store-db-credentials
              key: password
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        name: store-worker
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata:
  name: store-api
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  type: ClusterIP
  selector:
    app: store-api
  ports:
  - name: tcp
    port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: store-front
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  type: ClusterIP
  selector:
    app: store-front
  ports:
  - name: tcp
    port: 8080
    targetPort: 8080
