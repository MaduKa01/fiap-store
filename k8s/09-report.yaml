---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: store-report
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: store-report
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 10001
            runAsGroup: 10001
          containers:
          - image: 897783914221.dkr.ecr.us-east-1.amazonaws.com/store-worker:1.0
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
            envFrom:
            - configMapRef:
                name: store-api-config
            env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: store-db-credentials
                  key: password
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            command:
            - python
            - "-m"
            - worker.relatorio
            name: store-report
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
          restartPolicy: Never
