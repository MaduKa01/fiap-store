---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: store-api
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: store-api-nodes
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: store-api-nodes
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: store-api-nodes
subjects:
- kind: ServiceAccount
  name: store-api
  namespace: store-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: store-dev-reader
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: store-dev-reader
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: store-dev-reader
subjects:
- kind: Group
  name: fiap:devs
  apiGroup: rbac.authorization.k8s.io
